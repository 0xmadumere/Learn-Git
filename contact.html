<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>
<link rel="stylesheet" href="ass.css">
</head>

<body>

<fieldset>

    <legend class="i">
        <img src="sexy.jpeg" alt="Profile Picture">
    </legend>

    <div class="ii">
        <h2>CONTACT ME</h2>
        <p>I'd love to hear from you.</p>
    </div>

    <div class="iv">

        <form>

            <label for="fname">Full Name</label><br><br>
            <input type="text" id="fname" name="fname" placeholder="Enter your name" required><br><br>

            <label for="email">Email Address</label><br><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

            <label for="message">Message</label><br><br>
            <textarea rows="6" id="message" name="message" placeholder="Type your message here"></textarea>

        </form>

    </div>

    <div class="iii">
        <button type="submit">Send Message</button>
    </div>

    <div class="v">
        <a href="ass.html">
            <button>Back Home</button>
        </a>
    </div>

</fieldset>

</body>
</html>
